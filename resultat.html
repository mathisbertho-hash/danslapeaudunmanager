<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classement complet — Dans la peau d'un manager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="courses.html">
<main>
  <div id="contenu"><p class="empty">Chargement…</p></div>
</main>

<script src="js/data.js"></script>
<script src="js/points.js"></script>
<script src="js/nav.js"></script>
<script>
(async function () {
  const db = await loadAllData();
  const id = new URLSearchParams(location.search).get('id');
  const resultat = db.resultats.find(r => r.id === id);
  const el = document.getElementById('contenu');
  if (!resultat) { el.innerHTML = '<p class="empty">Résultat introuvable.</p>'; return; }

  const course = db.coursesById[resultat.courseId];
  const saisonLabel = db.saisons.find(s => s.id === resultat.saison)?.label || resultat.saison;
  const typeLabels = {
    classique: 'Classique', general: 'Général final', etape: `Étape ${resultat.etapeNumero ?? ''}`,
    points: 'Classement annexe — points', montagne: 'Classement annexe — montagne', jeune: 'Classement annexe — jeune',
  };

  const classement = resultat.classement.slice().sort((a, b) => {
    if (a.statut === 'classe' && b.statut !== 'classe') return -1;
    if (a.statut !== 'classe' && b.statut === 'classe') return 1;
    return (a.place || 999) - (b.place || 999);
  });

  const avecPrimes = course && !(db.bareme.sans_prime || []).includes(course.categorie);

  // Navigation dans un tour : étapes dans l'ordre, puis général et classements annexes
  const ORDRE = ['etape', 'general', 'points', 'montagne', 'jeune'];
  const COURT = { general: 'Général', points: 'Points', montagne: 'Montagne', jeune: 'Jeunes' };
  const sequence = db.resultats
    .filter(r => r.courseId === resultat.courseId && r.saison === resultat.saison && ORDRE.includes(r.type))
    .sort((a, b) => ORDRE.indexOf(a.type) - ORDRE.indexOf(b.type) || (a.etapeNumero || 0) - (b.etapeNumero || 0));
  const libCourt = r => r.type === 'etape' ? `Étape ${r.etapeNumero ?? '?'}` : COURT[r.type];
  const pos = sequence.indexOf(resultat);
  const prec = pos > 0 ? sequence[pos - 1] : null;
  const suiv = pos >= 0 && pos < sequence.length - 1 ? sequence[pos + 1] : null;
  const navTour = pos < 0 || sequence.length < 2 ? '' : `
    <div class="nav-etapes">
      ${prec ? `<a class="btn secondary" href="resultat.html?id=${prec.id}">← ${libCourt(prec)}</a>` : '<span></span>'}
      <div class="chips">${sequence.map(r => r === resultat
        ? `<span class="chip active">${r.type === 'etape' ? r.etapeNumero : COURT[r.type]}</span>`
        : `<a class="chip" href="resultat.html?id=${r.id}" title="${libCourt(r)}">${r.type === 'etape' ? r.etapeNumero : COURT[r.type]}</a>`).join('')}</div>
      ${suiv ? `<a class="btn secondary" href="resultat.html?id=${suiv.id}">${libCourt(suiv)} →</a>` : '<span></span>'}
    </div>`;

  el.innerHTML = `
    <h1>${course ? course.nom : '?'}</h1>
    <p class="lede"><a href="course.html?id=${resultat.courseId}">← retour à la fiche course</a> · ${typeLabels[resultat.type] || resultat.type} · ${saisonLabel}</p>
    ${navTour}

    <div class="table-wrap">
      <table class="results">
        <thead><tr><th class="num">Pl.</th><th>Coureur</th><th>Équipe</th><th>Nationalité</th><th>Temps</th><th class="num">Points</th>${avecPrimes ? '<th class="num">Primes</th>' : ''}</tr></thead>
        <tbody>${classement.map(l => {
          const c = db.coureursById[l.coureurId];
          const equipeId = db.equipeDuCoureur(l.coureurId, resultat.saison);
          const equipe = equipeId ? db.equipesById[equipeId] : null;
          const pp = course && l.statut === 'classe' ? pointsEtPrime(db, course, resultat.type, l.place) : { pts: 0, prime: 0 };
          return `<tr class="${l.place <= 3 && l.statut === 'classe' ? 'top3' : ''}">
            <td class="place num">${l.statut === 'classe' ? l.place : '—'}</td>
            <td>${c ? `<a href="coureur.html?id=${c.id}">${c.nom}</a>` : (l.coureurId || '?')}</td>
            <td>${equipe ? `<a href="equipe.html?id=${equipe.id}">${equipe.nom}</a>` : '<span class="badge warn">inconnue</span>'}</td>
            <td>${c?.nationalite ? `${db.flagForCountry(c.nationalite)} ${c.nationalite}` : ''}</td>
            <td>${l.statut === 'abandon' ? '<span class="badge warn">abandon</span>' : (l.temps || '—')}</td>
            <td class="num">${pp.pts || '—'}</td>${avecPrimes ? `<td class="num">${pp.prime ? fmtPrime(pp.prime) : '—'}</td>` : ''}
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>
  `;
})();
</script>
</body>
</html>
