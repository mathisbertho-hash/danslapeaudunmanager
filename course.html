<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiche course — Dans la peau d'un manager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="courses.html">
<main>
  <div id="contenu"><p class="empty">Chargement…</p></div>
</main>

<script src="js/data.js"></script>
<script src="js/nav.js"></script>
<script>
(async function () {
  const db = await loadAllData();
  const id = new URLSearchParams(location.search).get('id');
  const course = db.coursesById[id];
  const el = document.getElementById('contenu');
  if (!course) { el.innerHTML = '<p class="empty">Course introuvable.</p>'; return; }

  const resultatsPrincipaux = db.resultats.filter(r =>
    r.courseId === course.id && (r.type === 'scratch' || r.type === 'general')
  );
  const etapes = db.resultats
    .filter(r => r.courseId === course.id && r.type === 'etape')
    .slice()
    .sort((a, b) => (a.saison || '').localeCompare(b.saison || '') || (a.etapeNumero || 0) - (b.etapeNumero || 0));

  const profilLabels = {
    plat: 'Plat', accidente: 'Accidenté', montagne: 'Montagne',
    clm: 'Contre-la-montre', pave: 'Pavés', mixte: 'Mixte',
  };

  el.innerHTML = `
    <h1>${course.nom}</h1>
    <p class="lede"><span class="badge cat-${course.categorie}">${db.categoriesById[course.categorie]?.nom || course.categorie}</span>${course.pays ? ` · ${course.pays}` : ''}${course.profil ? ` · ${profilLabels[course.profil] || course.profil}` : ''}${course.nbEtapes ? ` · ${course.nbEtapes} étapes` : ''}</p>

    ${etapes.length > 0 ? `
    <h2 style="margin: 1rem 0 0.6rem;">Étapes</h2>
    <div class="table-wrap">
      <table class="results">
        <thead><tr><th>Saison</th><th class="num">Étape</th><th>Vainqueur</th><th></th></tr></thead>
        <tbody>${etapes.map(r => {
          const vainqueur = r.classement.find(l => l.place === 1 && l.statut === 'classe');
          const c = vainqueur ? db.coureursById[vainqueur.coureurId] : null;
          const saisonLabel = db.saisons.find(s => s.id === r.saison)?.label || r.saison;
          return `<tr><td>${saisonLabel}</td><td class="num">${r.etapeNumero ?? '—'}</td><td>${c ? `<a href="coureur.html?id=${c.id}">${c.nom}</a>` : '—'}</td><td><a href="resultat.html?id=${r.id}">classement complet →</a></td></tr>`;
        }).join('')}
        </tbody></table>
    </div>` : ''}

    <h2 style="margin: 1rem 0 0.6rem;">Vainqueurs successifs (scratch / général)</h2>
    <div class="table-wrap">
      ${resultatsPrincipaux.length === 0 ? '<p class="empty">Aucun résultat enregistré pour cette course.</p>' : `
      <table class="results">
        <thead><tr><th>Saison</th><th>Vainqueur</th><th></th></tr></thead>
        <tbody>${resultatsPrincipaux.map(r => {
          const vainqueur = r.classement.find(l => l.place === 1 && l.statut === 'classe');
          const c = vainqueur ? db.coureursById[vainqueur.coureurId] : null;
          const saisonLabel = db.saisons.find(s => s.id === r.saison)?.label || r.saison;
          return `<tr><td>${saisonLabel}</td><td>${c ? `<a href="coureur.html?id=${c.id}">${c.nom}</a>` : '—'}</td><td><a href="resultat.html?id=${r.id}">classement complet →</a></td></tr>`;
        }).join('')}
        </tbody></table>`}
    </div>
  `;
})();
</script>
</body>
</html>
