<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Équipes — Dans la peau d'un manager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="equipes.html">
<main>
  <h1>Équipes</h1>
  <p class="lede">Les écuries pro et leurs équipes de développement (circuit Espoirs).</p>
  <div class="table-wrap"><div id="liste"><p class="empty">Chargement…</p></div></div>
  <h2 id="titreDev" style="margin: 1.4rem 0 0.6rem;">Équipes de développement</h2>
  <div class="table-wrap"><div id="listeDev"></div></div>
</main>

<script src="js/data.js"></script>
<script src="js/nav.js"></script>
<script>
(async function () {
  const db = await loadAllData();
  const saison = db.saisons.find(s => s.statut === 'ouverte') || db.saisons[0];
  const effectifCount = {};
  db.effectifs.filter(e => e.saison === saison.id).forEach(e => {
    if (!e.equipe) return;
    effectifCount[e.equipe] = (effectifCount[e.equipe] || 0) + 1;
  });

  const ligne = e => `
      <tr>
        <td><a href="equipe.html?id=${e.id}">${e.nom}</a></td>
        <td>${e.manager_forum || '—'}</td>
        <td>${e.nationalite ? `${db.flagForCode(e.nationalite_code, e.nationalite)} ${e.nationalite}` : '<span class="badge">?</span>'}</td>
        <td class="num">${effectifCount[e.id] || 0}</td>
      </tr>`;
  const tableau = (liste) => `<table class="results">
    <thead><tr><th>Équipe</th><th>Manager</th><th>Nationalité</th><th class="num">Effectif</th></tr></thead>
    <tbody>${liste.map(ligne).join('')}</tbody></table>`;
  const tri = (a, b) => a.nom.localeCompare(b.nom);
  const pros = db.equipes.filter(e => e.type !== 'developpement').sort(tri);
  const devs = db.equipes.filter(e => e.type === 'developpement').sort(tri);
  document.getElementById('liste').innerHTML = tableau(pros);
  if (devs.length) document.getElementById('listeDev').innerHTML = tableau(devs);
  document.getElementById('titreDev').style.display = devs.length ? '' : 'none';
})();
</script>
</body>
</html>
