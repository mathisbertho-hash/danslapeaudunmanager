<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courses — Dans la peau d'un manager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="courses.html">
<main>
  <h1>Courses</h1>
  <p class="lede">Le calendrier de la saison et les vainqueurs successifs de chaque épreuve.</p>
  <div class="filters">
    <select id="fSaison"></select>
    <select id="fCategorie"><option value="">Toutes catégories</option></select>
  </div>
  <div class="table-wrap"><div id="liste"><p class="empty">Chargement…</p></div></div>
</main>

<script src="js/data.js"></script>
<script src="js/nav.js"></script>
<script>
(async function () {
  const db = await loadAllData();
  const fSaison = document.getElementById('fSaison');
  const fCategorie = document.getElementById('fCategorie');

  fSaison.innerHTML = '<option value="">Toutes saisons</option>' + db.saisons.map(s => `<option value="${s.id}">${s.label}</option>`).join('');
  const saisonOuverte = db.saisons.find(s => s.statut === 'ouverte');
  if (saisonOuverte) fSaison.value = saisonOuverte.id;

  fCategorie.innerHTML += db.categories.map(c => `<option value="${c.id}">${c.nom}</option>`).join('');

  function dateKey(c) {
    if (!c.dateDebut) return '99/99';
    const [j, m] = c.dateDebut.split('/');
    return `${m}${j}`;
  }

  function render() {
    const filtered = db.courses
      .filter(c => (!fSaison.value || c.saison === fSaison.value) && (!fCategorie.value || c.categorie === fCategorie.value))
      .slice()
      .sort((a, b) => dateKey(a).localeCompare(dateKey(b)));
    const el = document.getElementById('liste');
    if (filtered.length === 0) {
      el.innerHTML = '<p class="empty">Aucune course enregistrée pour l’instant. Ajoute-les depuis l’onglet Admin.</p>';
      return;
    }
    el.innerHTML = `<table class="results">
      <thead><tr><th>Date</th><th>Course</th><th>Catégorie</th><th>Pays</th><th>Coupe</th></tr></thead>
      <tbody>${filtered.map(c => {
        const periode = c.dateDebut ? (c.dateDebut === c.dateFin ? c.dateDebut : `${c.dateDebut}–${c.dateFin}`) : '—';
        const coupes = (c.coupes || []).map(cid => db.coupesById[cid]).filter(Boolean);
        return `<tr>
          <td>${periode}</td>
          <td><a href="course.html?id=${c.id}">${c.nom}</a></td>
          <td><span class="badge cat-${c.categorie}">${db.categoriesById[c.categorie]?.nom || c.categorie}</span></td>
          <td>${c.pays ? `${db.flagForCountry(c.pays)} ${c.pays}` : '—'}</td>
          <td>${coupes.map(cp => `<a href="coupe.html?id=${cp.id}"><span class="badge">${cp.nom}</span></a>`).join(' ') || '—'}</td>
        </tr>`;
      }).join('')}
      </tbody></table>`;
  }
  fSaison.addEventListener('change', render);
  fCategorie.addEventListener('change', render);
  render();
})();
</script>
</body>
</html>
