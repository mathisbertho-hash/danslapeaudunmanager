<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classement de coupe — Dans la peau d'un manager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="coupes.html">
<main>
  <div id="contenu"><p class="empty">Chargement…</p></div>
</main>

<script src="js/data.js"></script>
<script src="js/points.js"></script>
<script src="js/nav.js"></script>
<script>
(async function () {
  const db = await loadAllData();
  const id = new URLSearchParams(location.search).get('id');
  const coupe = db.coupesById[id];
  const el = document.getElementById('contenu');
  if (!coupe) { el.innerHTML = '<p class="empty">Coupe introuvable.</p>'; return; }

  const saisonsNonPreSaison = db.saisons.filter(s => !s.preSaison);
  const saisonOuverte = db.saisons.find(s => s.statut === 'ouverte') || saisonsNonPreSaison[0];

  el.innerHTML = `
    <h1>${coupe.portee === 'national' ? db.flagForCountry(coupe.pays) + ' ' : '🌍 '}${coupe.nom}</h1>
    <p class="lede">Additionne les points du barème de coupe sur les courses de la saison rattachées à « ${coupe.nom} ».</p>

    <div class="filters">
      <select id="fSaison">${saisonsNonPreSaison.map(s => `<option value="${s.id}">${s.label}</option>`).join('')}</select>
      <select id="fType">
        <option value="individuel">Classement individuel</option>
        <option value="equipes">Classement par équipes</option>
      </select>
    </div>

    <div id="resume" class="panel"></div>
    <div class="table-wrap"><div id="tableau"><p class="empty">Chargement…</p></div></div>

    <h2 style="margin: 1.2rem 0 0.6rem;">Courses de cette coupe</h2>
    <div class="table-wrap"><div id="listeCourses"></div></div>
  `;

  const fSaison = document.getElementById('fSaison');
  const fType = document.getElementById('fType');
  if (saisonOuverte) fSaison.value = saisonOuverte.id;

  function render() {
    const saisonId = fSaison.value;
    const resultat = calculerClassementCoupe(db, coupe.id, saisonId);
    const bareme = db.bareme.coupe?.[coupe.id] || {};
    const baremeVide = Object.keys(bareme).length === 0;

    document.getElementById('resume').innerHTML = `${resultat.nbCourses} résultat${resultat.nbCourses > 1 ? 's' : ''} pris en compte cette saison.`
      + (baremeVide ? ' <span class="badge warn">Barème de cette coupe pas encore renseigné — tous les classements afficheront 0 point.</span>' : '');

    const cle = fType.value === 'equipes' ? 'equipes' : 'individuel';
    const classe = avecRang(resultat[cle]);
    const tableau = document.getElementById('tableau');
    if (classe.length === 0) {
      tableau.innerHTML = '<p class="empty">Aucun point attribué pour l’instant.</p>';
    } else {
      const isTeam = cle === 'equipes';
      tableau.innerHTML = `<table class="results">
        <thead><tr><th class="num">Rg</th><th>${isTeam ? 'Équipe' : 'Coureur'}</th><th class="num">Points</th></tr></thead>
        <tbody>${classe.map(c => `
          <tr class="${c.rang <= 3 ? 'top3' : ''}">
            <td class="place num">${c.rang}</td>
            <td><a href="${isTeam ? 'equipe' : 'coureur'}.html?id=${encodeURIComponent(c.id)}">${c.label}</a></td>
            <td class="num">${c.valeur}</td>
          </tr>`).join('')}
        </tbody></table>`;
    }

    const coursesCoupe = db.courses.filter(c => c.saison === saisonId && Array.isArray(c.coupes) && c.coupes.includes(coupe.id));
    const listeCourses = document.getElementById('listeCourses');
    listeCourses.innerHTML = coursesCoupe.length === 0 ? '<p class="empty">Aucune course rattachée à cette coupe pour cette saison.</p>' : `<table class="results">
      <thead><tr><th>Course</th><th>Catégorie</th><th>Pays</th></tr></thead>
      <tbody>${coursesCoupe.map(c => `
        <tr>
          <td><a href="course.html?id=${c.id}">${c.nom}</a></td>
          <td><span class="badge cat-${c.categorie}">${db.categoriesById[c.categorie]?.nom || c.categorie}</span></td>
          <td>${c.pays ? `${db.flagForCountry(c.pays)} ${c.pays}` : '—'}</td>
        </tr>`).join('')}
      </tbody></table>`;
  }

  fSaison.addEventListener('change', render);
  fType.addEventListener('change', render);
  render();
})();
</script>
</body>
</html>
